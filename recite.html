<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背诵 · WenCaleb</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    /* .js：功能开关；.motion：动效开关（减少动态时不加，页面默认全可见） */
    document.documentElement.classList.add('js');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
    }
  </script>
  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/js/motion.js" defer></script>
  <style>
    :root {
      --bg: #dedad3;
      --surface: #d3cec6;
      --ink: #0a0a0a;
      --muted: #5c5852;
      --accent: #256f82;
      --accent-ink: #ffffff;
      --on-dark: #dedad3;
      --on-dark-muted: #b5b0a6;

      --font-display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --font-text: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

      --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
      --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
      --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
      --step-display: clamp(9.375rem, 19vw, 18.125rem);

      --margin: 2rem;
      --gutter: 2rem;
      --section: clamp(5rem, 12vw, 13rem);
      --radius: 0px;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --t-press: 140ms;
      --t-hover: 180ms;
      --t-reveal: 750ms;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-text);
      font-size: var(--step-body);
      line-height: 1.5;
      font-kerning: normal;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, p, figure, ul, li { margin: 0; }
    ul { padding: 0; list-style: none; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    ::selection { background: var(--accent); color: var(--accent-ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .nums { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .skip {
      position: absolute; left: 1rem; top: -4rem; z-index: 10;
      background: var(--ink); color: var(--bg);
      padding: 0.6rem 1rem; font-size: var(--step-body); text-decoration: none;
      transition: top var(--t-hover) var(--ease-out);
    }
    .skip:focus { top: 1rem; }

    /* ---------- top bar ---------- */
    .nav {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: var(--margin);
      background: var(--bg);
    }
    .nav-mark { font-size: var(--step-small); font-weight: 500; letter-spacing: 0.01em; text-decoration: none; }
    .nav-links { display: flex; gap: 1.75rem; font-size: var(--step-body); }
    .nav-links a { text-decoration: none; white-space: nowrap; }
    .nav-links a:hover { text-decoration: underline; text-underline-offset: 0.25em; }

    /* ---------- page head ---------- */
    .page-head {
      background: var(--bg);
      padding: clamp(4rem, 10vw, 9rem) var(--margin) clamp(3rem, 7vw, 6rem);
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 13.5vw, 12rem);
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.04em;
      margin-bottom: -0.08em;
    }
    .page-sub {
      margin-top: 1.25rem;
      font-size: var(--step-lead);
      color: var(--muted);
    }
    .page-note {
      margin-top: 2.75rem;
      font-size: var(--step-lead);
      line-height: 1.4;
      max-width: 26ch;
    }

    /* ---------- list ---------- */
    .groups { background: var(--bg); padding-bottom: var(--section); }
    .group { padding: clamp(2.5rem, 6vw, 5rem) var(--margin) 0; }
    .group-title {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 1.1rem + 2.4vw, 3.25rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.02em;
    }
    .group-count { font-weight: 400; font-size: var(--step-body); color: var(--muted); margin-left: 0.75rem; white-space: nowrap; }
    .group-list {
      margin-top: 3rem;
      display: grid;
      row-gap: 1.625rem;
    }
    .res-row {
      display: grid;
      grid-template-columns: minmax(0, 22rem) minmax(0, 1fr) auto;
      align-items: baseline;
      column-gap: 1.5rem;
      font-size: var(--step-body);
    }
    .res-name { font-weight: 500; }
    .res-desc { color: var(--muted); }
    .res-url { text-align: right; text-decoration: none; white-space: nowrap; }
    .res-url .arrow { color: var(--muted); }
    .res-url:hover { text-decoration: underline; text-underline-offset: 0.25em; }

    /* ---------- footer ---------- */
    .footer {
      position: relative; z-index: 1;
      min-height: 100svh;
      background: var(--ink);
      color: var(--on-dark);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--margin);
    }
    .footer-cols {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 2rem;
      align-content: start;
    }
    .footer-cols li { font-size: var(--step-body); line-height: 1.7; }
    .footer-cols li + li { color: var(--on-dark-muted); }
    .footer-cols li.footer-cols-label { color: var(--on-dark); font-weight: 500; }
    .footer-cols a { text-decoration: none; }
    .footer-cols a:hover { text-decoration: underline; text-underline-offset: 0.25em; }
    .footer-clock { font-size: var(--step-body); }
    .footer-bottom { align-self: end; }
    .footer-wordmark {
      font-family: var(--font-display);
      font-size: clamp(4.5rem, 19vw, 18.75rem);
      font-weight: 600;
      line-height: 0.82;
      letter-spacing: -0.04em;
      white-space: nowrap;
      margin-bottom: 1.25rem;
    }
    .footer-legal {
      font-size: var(--step-body);
      color: var(--on-dark-muted);
      max-width: 44ch;
    }

    /* ---------- motion（GSAP 接管；.motion 缺失时页面默认全可见） ---------- */
    .motion .reveal { opacity: 0; transform: translateY(28px); }
    .char-wrap { display: inline-block; overflow: hidden; vertical-align: bottom; }
    .motion .char { display: inline-block; transform: translateY(115%); }

    /* 降级：GSAP 失败 / 脚本未启动 → 一切可见 */
    .motion-off .reveal, .motion-off .char { opacity: 1 !important; transform: none !important; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    /* ---------- phone ---------- */
    @media (max-width: 48em) {
      :root { --margin: 1.25rem; --gutter: 1.25rem; }
      .page-title { font-size: 15vw; }
      .page-note { max-width: 100%; }
      .res-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 0.15rem; }
      .res-desc { grid-column: 1 / -1; }
      .res-name { grid-column: 1; }
      .res-url { grid-column: 2; }
      .footer-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 2rem; }
      .footer-wordmark { font-size: 19vw; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#recite">跳到内容</a>

  <nav class="nav" aria-label="站内导航">
    <a class="nav-mark" href="index.html">WenCaleb</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="resources.html">资源</a>
      <a href="https://github.com/WenCaleb" target="_blank" rel="noopener">GitHub<span aria-hidden="true"> ↗</span></a>
    </div>
  </nav>

  <main id="recite">
    <section class="page-head">
      <h1 class="page-title" data-motion="chars">RECITE</h1>
      <p class="page-sub reveal">背诵</p>
      <p class="page-note reveal">背下来的经文，<br>放在这里，常回来读。</p>
    </section>

    <div class="groups">
      <section class="group reveal">
        <h2 class="group-title">清单<span class="group-count nums" id="list-count"></span></h2>
        <ul class="group-list" id="list"><!-- 由 recite/list.js 渲染 --></ul>
      </section>
    </div>
  </main>

  <footer class="footer">
    <ul class="footer-cols">
      <li class="reveal">
        <ul>
          <li class="footer-cols-label">本站</li>
          <li>WenCaleb 的个人网站</li>
          <li>背诵清单陆续增加</li>
          <li>托管在 GitHub Pages</li>
        </ul>
      </li>
      <li class="reveal">
        <ul>
          <li class="footer-cols-label">导航</li>
          <li><a href="index.html">首页</a></li>
          <li><a href="resources.html">资源</a></li>
          <li><a href="https://github.com/WenCaleb" target="_blank" rel="noopener">GitHub<span aria-hidden="true"> ↗</span></a></li>
          <li><a href="#recite">回到顶部</a></li>
        </ul>
      </li>
      <li class="reveal">
        <ul>
          <li class="footer-cols-label">状态</li>
          <li>内容陆续补充中</li>
          <li>这个网站刚出生</li>
        </ul>
      </li>
      <li class="reveal">
        <ul>
          <li class="footer-cols-label">时间</li>
          <li>北京时间</li>
          <li class="footer-clock nums" id="clock">--:--:--</li>
        </ul>
      </li>
    </ul>
    <div></div>
    <div class="footer-bottom">
      <p class="footer-wordmark" data-motion="chars">WenCaleb</p>
      <p class="footer-legal reveal">© 2026 WenCaleb</p>
    </div>
  </footer>

  <script src="recite/list.js"></script>
  <script>
    (function () {
      /* —— 渲染清单列表 —— */
      var ul = document.getElementById('list');
      RECITE_FILES.forEach(function (item, i) {
        var li = document.createElement('li');
        li.className = 'res-row reveal';

        var name = document.createElement('span');
        name.className = 'res-name';
        name.textContent = item.title;

        var desc = document.createElement('span');
        desc.className = 'res-desc';
        desc.textContent = item.desc;

        var a = document.createElement('a');
        a.className = 'res-url';
        a.href = 'recite-read.html?f=' + encodeURIComponent(item.file);
        a.textContent = '打开';
        var arrow = document.createElement('span');
        arrow.className = 'arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = ' ↗';
        a.appendChild(arrow);

        li.appendChild(name);
        li.appendChild(desc);
        li.appendChild(a);
        ul.appendChild(li);
      });
      document.getElementById('list-count').textContent = RECITE_FILES.length + ' 份';

      /* —— reveal 动效由 assets/js/motion.js 统一处理 —— */

      /* —— footer 时钟 —— */
      var clock = document.getElementById('clock');
      function tick() {
        try {
          clock.textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false, timeZone: 'Asia/Shanghai' });
        } catch (err) {
          clock.textContent = new Date().toTimeString().slice(0, 8);
        }
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>

  <!-- 兜底：动效脚本没启动时，强制显示全部内容 -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.__motionStarted) document.documentElement.classList.add('motion-off');
      }, 1200);
    });
  </script>
</body>
